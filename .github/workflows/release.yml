#
# Release: pushing a tag v<version> (the version in build.zig.zon) builds
# the self-contained binaries, signs + notarizes the macOS dmg
# (scripts/sign-macos.sh, secrets of the channel's environment), makes the
# .deb / .rpm / .tar.gz and publishes them as a GitHub release.
#
# Two channels, from the tag's MINOR number:
#   odd  (v1.9.2)  edge:   environment "edge", a pre-release, not latest;
#   even (v1.10.0) stable: environment "release", a normal release, latest.
#
# Two long-lived branches: develop (edge) and main (stable). An edge tag
# must be on develop, a stable tag on main.
#
# Promote: on develop set build.zig.zon to x.(even).0, merge --no-ff into
# main, tag there, then bump develop to the next edge version:
#
#   git switch main && git merge --no-ff develop
#   git tag -a v1.10.0 -m v1.10.0 && git push origin main v1.10.0
#
# Stable fix: commit on main with the version bumped to x.y.N+1, tag it,
# then merge main into develop.
#
# Run by hand (Actions → Release → Run workflow): the same build, signed
# and notarized, kept as a workflow artifact only; no release, no tag.
#
# The secrets (MACOS_CERT_P12, MACOS_CERT_PASSWORD, KEYCHAIN_PASSWORD,
# APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID)
# are loaded by scripts/set-github-secrets.sh.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which channel the tag is for: edge (odd minor) or stable (even minor).
  channel:
    name: Channel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      env: ${{ steps.channel.outputs.env }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, for the stable guard
          persist-credentials: false

      - name: Channel from the tag
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Run by hand on a branch: a build only (no release), with the
          # stable environment's secrets, as before.
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "env=release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag $TAG isn't v<major>.<minor>.<patch> (digits only)"
            exit 1
          fi
          minor=${BASH_REMATCH[2]}
          if (( 10#$minor % 2 == 1 )); then
            chan=edge env=edge prerelease=true branch=develop
          else
            chan=stable env=release prerelease=false branch=main
          fi
          echo "$TAG: $chan ($env, pre-release: $prerelease)"
          # Edge tags go on develop, stable tags on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$TAG is a $chan tag: its commit must be on $branch"
            exit 1
          fi
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, notarize, publish
    needs: channel
    runs-on: macos-15
    environment: ${{ needs.channel.outputs.env }}
    permissions:
      contents: write # create the release and upload the packages
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install packaging tools
        run: brew install nfpm

      - name: Version
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          v=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$v" ]; then
            echo "::error::tag $TAG doesn't match build.zig.zon's version $v (expected v$v)"
            exit 1
          fi

      # build-bin.sh (macOS + Linux binaries), package.sh (dmg, deb, rpm,
      # tar.gz), signing in a temporary keychain, notarization + staple.
      - name: Build, sign and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/sign-macos.sh

      - name: Check the dmg
        run: |
          dmg="dist/gtty-${{ steps.version.outputs.version }}-macos.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's|^/dev/[^[:space:]]*[[:space:]]*Apple_HFS[[:space:]]*||p')
          codesign --verify --deep --strict --verbose=2 "$mnt/gtty.app"
          spctl --assess --type execute --verbose "$mnt/gtty.app"
          hdiutil detach -quiet "$mnt"

      - name: Checksums
        run: |
          cd dist
          v=${{ steps.version.outputs.version }}
          shasum -a 256 "gtty-$v-macos.dmg" "gtty_${v}_amd64.deb" "gtty-$v-1.x86_64.rpm" "gtty-$v-linux-x86_64.tar.gz" > "gtty-$v-SHA256SUMS.txt"
          cat "gtty-$v-SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: gtty-${{ steps.version.outputs.version }}
          path: |
            dist/gtty-${{ steps.version.outputs.version }}-*
            dist/gtty_${{ steps.version.outputs.version }}_*
          if-no-files-found: error

      # Edge: a pre-release, never latest. Stable: a normal release, latest.
      # A release made by hand for this tag already: its notes stay, the
      # channel's flags are set and the files uploaded (replacing any).
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.channel.outputs.prerelease }}
        run: |
          v=${{ steps.version.outputs.version }}
          files=("dist/gtty-$v-macos.dmg" "dist/gtty_${v}_amd64.deb"
            "dist/gtty-$v-1.x86_64.rpm" "dist/gtty-$v-linux-x86_64.tar.gz"
            "dist/gtty-$v-SHA256SUMS.txt")
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --generate-notes "${flags[@]}" "${files[@]}"
          fi
